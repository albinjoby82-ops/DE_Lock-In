<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 288" width="680" height="288" font-family="Atkinson Hyperlegible, Verdana, Arial, sans-serif" role="img"><title>Simplify  A&#x27;B&#x27;C + A&#x27;BC&#x27; + A&#x27;BC + ABC</title><rect width="100%" height="100%" fill="#ffffff"/><text x="24.0" y="30.0" font-size="17" text-anchor="start" fill="#1b1f24" font-weight="bold">Simplify  A&#x27;B&#x27;C + A&#x27;BC&#x27; + A&#x27;BC + ABC</text><text x="24" y="74" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan>A&#x27;B&#x27;C + A&#x27;BC&#x27; + </tspan><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">A&#x27;BC</tspan><tspan> + ABC</tspan></text><polyline points="34.0,86.0 34.0,112.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,112.0 30.1,103.9 37.9,103.9" fill="#bc4c00"/><text x="52.0" y="105.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">Idempotent (copy)</text><text x="250.0" y="105.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">A&#x27;BC pairs with all 3 others, so write it 3 times</text><text x="24" y="132" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan>(</tspan><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">A&#x27;B&#x27;C + A&#x27;BC</tspan><tspan>) + (</tspan><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">A&#x27;BC&#x27; + A&#x27;BC</tspan><tspan>) + (</tspan><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">A&#x27;BC + ABC</tspan><tspan>)</tspan></text><polyline points="34.0,144.0 34.0,170.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,170.0 30.1,161.9 37.9,161.9" fill="#bc4c00"/><text x="52.0" y="163.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">Distributive (factor)</text><text x="250.0" y="163.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">pull out A&#x27;C, A&#x27;B and BC</text><text x="24" y="190" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan>A&#x27;C</tspan><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">(B&#x27; + B)</tspan><tspan> + A&#x27;B</tspan><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">(C&#x27; + C)</tspan><tspan> + BC</tspan><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">(A&#x27; + A)</tspan></text><polyline points="34.0,202.0 34.0,228.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,228.0 30.1,219.9 37.9,219.9" fill="#bc4c00"/><text x="52.0" y="221.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">Complement</text><text x="250.0" y="221.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">every bracket = 1</text><rect x="18.0" y="236.0" width="184.0" height="38.0" rx="6" fill="#127a8322" stroke="#127a83" stroke-width="2"/><text x="32.0" y="262.0" font-size="20" text-anchor="start" fill="#127a83" font-weight="bold">A&#x27;C + A&#x27;B + BC</text></svg>