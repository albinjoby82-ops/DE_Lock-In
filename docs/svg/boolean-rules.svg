<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="Atkinson Hyperlegible, Verdana, Arial, sans-serif" role="img"><title>Boolean algebra rules grouped by what they do</title><rect width="100%" height="100%" fill="#ffffff"/><text x="295.0" y="26.0" font-size="15" text-anchor="middle" fill="#1b1f24" font-weight="bold">OR form</text><text x="515.0" y="26.0" font-size="15" text-anchor="middle" fill="#1b1f24" font-weight="bold">AND form</text><text x="20.0" y="60.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="bold">Null</text><text x="20.0" y="77.0" font-size="12" text-anchor="start" fill="#6a737d" font-weight="normal">kills the term</text><rect x="190.0" y="44.0" width="210.0" height="38.0" rx="5" fill="#bc4c0022" stroke="#bc4c00" stroke-width="1.5"/><text x="295.0" y="69.0" font-size="16" text-anchor="middle" fill="#1b1f24" font-weight="bold">x + 1 = 1</text><rect x="410.0" y="44.0" width="210.0" height="38.0" rx="5" fill="#bc4c0022" stroke="#bc4c00" stroke-width="1.5"/><text x="515.0" y="69.0" font-size="16" text-anchor="middle" fill="#1b1f24" font-weight="bold">x·0 = 0</text><text x="20.0" y="108.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="bold">Complement</text><text x="20.0" y="125.0" font-size="12" text-anchor="start" fill="#6a737d" font-weight="normal">x meets x&#x27;</text><rect x="190.0" y="92.0" width="210.0" height="38.0" rx="5" fill="#bc4c0022" stroke="#bc4c00" stroke-width="1.5"/><text x="295.0" y="117.0" font-size="16" text-anchor="middle" fill="#1b1f24" font-weight="bold">x + x&#x27; = 1</text><rect x="410.0" y="92.0" width="210.0" height="38.0" rx="5" fill="#bc4c0022" stroke="#bc4c00" stroke-width="1.5"/><text x="515.0" y="117.0" font-size="16" text-anchor="middle" fill="#1b1f24" font-weight="bold">x·x&#x27; = 0</text><text x="20.0" y="156.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="bold">Identity</text><text x="20.0" y="173.0" font-size="12" text-anchor="start" fill="#6a737d" font-weight="normal">does nothing</text><rect x="190.0" y="140.0" width="210.0" height="38.0" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="295.0" y="165.0" font-size="16" text-anchor="middle" fill="#1b1f24" font-weight="normal">x + 0 = x</text><rect x="410.0" y="140.0" width="210.0" height="38.0" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="515.0" y="165.0" font-size="16" text-anchor="middle" fill="#1b1f24" font-weight="normal">x·1 = x</text><text x="20.0" y="204.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="bold">Idempotent</text><text x="20.0" y="221.0" font-size="12" text-anchor="start" fill="#6a737d" font-weight="normal">merges copies</text><rect x="190.0" y="188.0" width="210.0" height="38.0" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="295.0" y="213.0" font-size="16" text-anchor="middle" fill="#1b1f24" font-weight="normal">x + x = x</text><rect x="410.0" y="188.0" width="210.0" height="38.0" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="515.0" y="213.0" font-size="16" text-anchor="middle" fill="#1b1f24" font-weight="normal">x·x = x</text><text x="20.0" y="252.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="bold">Distributive</text><text x="20.0" y="269.0" font-size="12" text-anchor="start" fill="#6a737d" font-weight="normal">expand or factor</text><rect x="190.0" y="236.0" width="210.0" height="38.0" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="295.0" y="261.0" font-size="16" text-anchor="middle" fill="#1b1f24" font-weight="normal">x + yz = (x + y)(x + z)</text><rect x="410.0" y="236.0" width="210.0" height="38.0" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="515.0" y="261.0" font-size="16" text-anchor="middle" fill="#1b1f24" font-weight="normal">x(y + z) = xy + xz</text><text x="20.0" y="300.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="bold">De Morgan</text><text x="20.0" y="317.0" font-size="12" text-anchor="start" fill="#6a737d" font-weight="normal">flip bar, swap + ·</text><rect x="190.0" y="284.0" width="210.0" height="38.0" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="295.0" y="309.0" font-size="16" text-anchor="middle" fill="#1b1f24" font-weight="normal">(x + y)&#x27; = x&#x27;y&#x27;</text><rect x="410.0" y="284.0" width="210.0" height="38.0" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="515.0" y="309.0" font-size="16" text-anchor="middle" fill="#1b1f24" font-weight="normal">(xy)&#x27; = x&#x27; + y&#x27;</text><polyline points="20.0,342.0 620.0,342.0" fill="none" stroke="#8c959f" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="20.0" y="366.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">Shortcuts (each has an AND twin)</text><text x="20.0" y="403.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="bold">Absorption</text><rect x="190.0" y="378.0" width="250.0" height="38.0" rx="5" fill="#127a8322" stroke="#127a83" stroke-width="1.5"/><text x="315.0" y="403.0" font-size="16" text-anchor="middle" fill="#1b1f24" font-weight="bold">x + xy = x</text><text x="455.0" y="402.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">xy is swallowed</text><text x="20.0" y="451.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="bold">Drop the x&#x27;</text><rect x="190.0" y="426.0" width="250.0" height="38.0" rx="5" fill="#127a8322" stroke="#127a83" stroke-width="1.5"/><text x="315.0" y="451.0" font-size="16" text-anchor="middle" fill="#1b1f24" font-weight="bold">x + x&#x27;y = x + y</text><text x="455.0" y="450.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">x&#x27; disappears</text><text x="20.0" y="499.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="bold">Consensus</text><rect x="190.0" y="474.0" width="250.0" height="38.0" rx="5" fill="#127a8322" stroke="#127a83" stroke-width="1.5"/><text x="315.0" y="499.0" font-size="16" text-anchor="middle" fill="#1b1f24" font-weight="bold">xy + x&#x27;z + yz = xy + x&#x27;z</text><text x="455.0" y="498.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">yz is redundant</text><rect x="20.0" y="532.0" width="14.0" height="14.0" rx="3" fill="#bc4c0022" stroke="#bc4c00" stroke-width="1.5"/><text x="42.0" y="544.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">kills a term</text><rect x="190.0" y="532.0" width="14.0" height="14.0" rx="3" fill="#127a8322" stroke="#127a83" stroke-width="1.5"/><text x="212.0" y="544.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">shortcut</text><rect x="330.0" y="532.0" width="14.0" height="14.0" rx="3" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="352.0" y="544.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">tidy or rewrite</text></svg>