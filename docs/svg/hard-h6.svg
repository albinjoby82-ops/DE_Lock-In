<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" width="680" height="404" font-family="Atkinson Hyperlegible, Verdana, Arial, sans-serif" role="img"><title>Simplify  (A + B + C)(A + B + C&#x27;)(A + B&#x27; + C)</title><rect width="100%" height="100%" fill="#ffffff"/><text x="24.0" y="30.0" font-size="17" text-anchor="start" fill="#1b1f24" font-weight="bold">Simplify  (A + B + C)(A + B + C&#x27;)(A + B&#x27; + C)</text><text x="24" y="74" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">(A + B + C)(A + B + C&#x27;)</tspan><tspan>(A + B&#x27; + C)</tspan></text><polyline points="34.0,86.0 34.0,112.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,112.0 30.1,103.9 37.9,103.9" fill="#bc4c00"/><text x="52.0" y="105.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">Distributive (backwards)</text><text x="250.0" y="105.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">share A + B:  (X + C)(X + C&#x27;) = X + CC&#x27;</text><text x="24" y="132" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan>(A + B + </tspan><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">CC&#x27;</tspan><tspan>)(A + B&#x27; + C)</tspan></text><polyline points="34.0,144.0 34.0,170.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,170.0 30.1,161.9 37.9,161.9" fill="#bc4c00"/><text x="52.0" y="163.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">Complement</text><text x="250.0" y="163.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">CC&#x27; = 0</text><text x="24" y="190" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">(A + B)(A + B&#x27; + C)</tspan></text><polyline points="34.0,202.0 34.0,228.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,228.0 30.1,219.9 37.9,219.9" fill="#bc4c00"/><text x="52.0" y="221.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">Distributive (backwards)</text><text x="250.0" y="221.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">share A:  (A + X)(A + Y) = A + XY</text><text x="24" y="248" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan>A + </tspan><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">B(B&#x27; + C)</tspan></text><polyline points="34.0,260.0 34.0,286.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,286.0 30.1,277.9 37.9,277.9" fill="#bc4c00"/><text x="52.0" y="279.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">Distributive (expand)</text><text x="250.0" y="279.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">multiply B in</text><text x="24" y="306" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan>A + </tspan><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">BB&#x27;</tspan><tspan> + BC</tspan></text><polyline points="34.0,318.0 34.0,344.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,344.0 30.1,335.9 37.9,335.9" fill="#bc4c00"/><text x="52.0" y="337.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">Complement</text><text x="250.0" y="337.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">BB&#x27; = 0</text><rect x="18.0" y="352.0" width="96.0" height="38.0" rx="6" fill="#127a8322" stroke="#127a83" stroke-width="2"/><text x="32.0" y="378.0" font-size="20" text-anchor="start" fill="#127a83" font-weight="bold">A + BC</text></svg>