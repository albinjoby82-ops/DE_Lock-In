<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 230" width="470" height="230" font-family="Atkinson Hyperlegible, Verdana, Arial, sans-serif" role="img"><title>4-to-1 multiplexer</title><rect width="100%" height="100%" fill="#ffffff"/><path d="M90,20 L192,47.0 L192,143.0 L90,170 Z" fill="#f6f8fa" stroke="#1b1f24" stroke-width="2"/><text x="141.0" y="100.0" font-size="12" text-anchor="middle" fill="#6a737d" font-weight="bold">4-to-1</text><polyline points="60.0,50.0 90.0,50.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="95.0" y="54.0" font-size="11" text-anchor="start" fill="#6a737d" font-weight="normal">0</text><text x="54.0" y="55.0" font-size="15" text-anchor="end" fill="#1b1f24" font-weight="bold">I₀</text><polyline points="60.0,80.0 90.0,80.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="95.0" y="84.0" font-size="11" text-anchor="start" fill="#6a737d" font-weight="normal">1</text><text x="54.0" y="85.0" font-size="15" text-anchor="end" fill="#1b1f24" font-weight="bold">I₁</text><polyline points="60.0,110.0 90.0,110.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="95.0" y="114.0" font-size="11" text-anchor="start" fill="#6a737d" font-weight="normal">2</text><text x="54.0" y="115.0" font-size="15" text-anchor="end" fill="#1b1f24" font-weight="bold">I₂</text><polyline points="60.0,140.0 90.0,140.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="95.0" y="144.0" font-size="11" text-anchor="start" fill="#6a737d" font-weight="normal">3</text><text x="54.0" y="145.0" font-size="15" text-anchor="end" fill="#1b1f24" font-weight="bold">I₃</text><polyline points="124.0,161.0 124.0,196.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="124.0" y="212.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="bold">S₁</text><polyline points="158.0,152.0 158.0,196.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="158.0" y="212.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="bold">S₀</text><polyline points="192.0,95.0 222.0,95.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="230.0" y="100.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="bold">Y</text><text x="300.0" y="40.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="bold">S₁ S₀ → Y</text><text x="300.0" y="68.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="normal"> 0   0  →  I₀</text><text x="300.0" y="94.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="normal"> 0   1  →  I₁</text><text x="300.0" y="120.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="normal"> 1   0  →  I₂</text><text x="300.0" y="146.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="normal"> 1   1  →  I₃</text><text x="300.0" y="190.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">selects = a number</text><text x="300.0" y="208.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">that number picks the input</text></svg>