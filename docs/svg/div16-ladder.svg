<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 272" width="520" height="272" font-family="Atkinson Hyperlegible, Verdana, Arial, sans-serif" role="img"><title>300 to hex by dividing by 16</title><rect width="100%" height="100%" fill="#ffffff"/><text x="30.0" y="30.0" font-size="16" text-anchor="start" fill="#1b1f24" font-weight="bold">Same thing in hex: divide by 16</text><text x="30.0" y="84.0" font-size="18" text-anchor="start" fill="#1b1f24" font-weight="normal">300 ÷ 16 = 18  rem</text><rect x="300.0" y="60.0" width="50.0" height="34.0" rx="6" fill="#0969da18" stroke="#0969da" stroke-width="2"/><text x="325.0" y="85.0" font-size="20" text-anchor="middle" fill="#0969da" font-weight="bold">C</text><text x="30.0" y="128.0" font-size="18" text-anchor="start" fill="#1b1f24" font-weight="normal">18 ÷ 16 = 1    rem</text><rect x="300.0" y="104.0" width="50.0" height="34.0" rx="6" fill="#0969da18" stroke="#0969da" stroke-width="2"/><text x="325.0" y="129.0" font-size="20" text-anchor="middle" fill="#0969da" font-weight="bold">2</text><text x="30.0" y="172.0" font-size="18" text-anchor="start" fill="#1b1f24" font-weight="normal">1 ÷ 16 = 0     rem</text><rect x="300.0" y="148.0" width="50.0" height="34.0" rx="6" fill="#0969da18" stroke="#0969da" stroke-width="2"/><text x="325.0" y="173.0" font-size="20" text-anchor="middle" fill="#0969da" font-weight="bold">1</text><polyline points="380.0,178.0 380.0,64.0" fill="none" stroke="#0969da" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="380.0,64.0 383.9,72.1 376.1,72.1" fill="#0969da"/><text x="392.0" y="76.0" font-size="12" text-anchor="start" fill="#6a737d" font-weight="normal">1st remainder = LSB</text><text x="392.0" y="174.0" font-size="12" text-anchor="start" fill="#6a737d" font-weight="normal">last remainder = MSB</text><text x="392.0" y="190.0" font-size="12" text-anchor="start" fill="#6a737d" font-weight="normal">(write this one first)</text><text x="392.0" y="126.0" font-size="16" text-anchor="start" fill="#0969da" font-weight="bold">read UP</text><text x="30.0" y="232.0" font-size="22" text-anchor="start" fill="#1b1f24" font-weight="bold">300 = 12C₁₆</text><text x="30.0" y="258.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">remainder 12 is written C  (A=10 B=11 C=12 D=13 E=14 F=15)</text></svg>