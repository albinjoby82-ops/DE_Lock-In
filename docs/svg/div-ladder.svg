<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 404" width="520" height="404" font-family="Atkinson Hyperlegible, Verdana, Arial, sans-serif" role="img"><title>41 to binary by dividing by 2</title><rect width="100%" height="100%" fill="#ffffff"/><text x="30.0" y="30.0" font-size="16" text-anchor="start" fill="#1b1f24" font-weight="bold">Whole part: keep dividing by 2</text><text x="30.0" y="84.0" font-size="18" text-anchor="start" fill="#1b1f24" font-weight="normal">41 ÷ 2 = 20  rem</text><rect x="300.0" y="60.0" width="50.0" height="34.0" rx="6" fill="#0969da18" stroke="#0969da" stroke-width="2"/><text x="325.0" y="85.0" font-size="20" text-anchor="middle" fill="#0969da" font-weight="bold">1</text><text x="30.0" y="128.0" font-size="18" text-anchor="start" fill="#1b1f24" font-weight="normal">20 ÷ 2 = 10  rem</text><rect x="300.0" y="104.0" width="50.0" height="34.0" rx="6" fill="#0969da18" stroke="#0969da" stroke-width="2"/><text x="325.0" y="129.0" font-size="20" text-anchor="middle" fill="#0969da" font-weight="bold">0</text><text x="30.0" y="172.0" font-size="18" text-anchor="start" fill="#1b1f24" font-weight="normal">10 ÷ 2 = 5   rem</text><rect x="300.0" y="148.0" width="50.0" height="34.0" rx="6" fill="#0969da18" stroke="#0969da" stroke-width="2"/><text x="325.0" y="173.0" font-size="20" text-anchor="middle" fill="#0969da" font-weight="bold">0</text><text x="30.0" y="216.0" font-size="18" text-anchor="start" fill="#1b1f24" font-weight="normal">5 ÷ 2 = 2    rem</text><rect x="300.0" y="192.0" width="50.0" height="34.0" rx="6" fill="#0969da18" stroke="#0969da" stroke-width="2"/><text x="325.0" y="217.0" font-size="20" text-anchor="middle" fill="#0969da" font-weight="bold">1</text><text x="30.0" y="260.0" font-size="18" text-anchor="start" fill="#1b1f24" font-weight="normal">2 ÷ 2 = 1    rem</text><rect x="300.0" y="236.0" width="50.0" height="34.0" rx="6" fill="#0969da18" stroke="#0969da" stroke-width="2"/><text x="325.0" y="261.0" font-size="20" text-anchor="middle" fill="#0969da" font-weight="bold">0</text><text x="30.0" y="304.0" font-size="18" text-anchor="start" fill="#1b1f24" font-weight="normal">1 ÷ 2 = 0    rem</text><rect x="300.0" y="280.0" width="50.0" height="34.0" rx="6" fill="#0969da18" stroke="#0969da" stroke-width="2"/><text x="325.0" y="305.0" font-size="20" text-anchor="middle" fill="#0969da" font-weight="bold">1</text><polyline points="380.0,310.0 380.0,64.0" fill="none" stroke="#0969da" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="380.0,64.0 383.9,72.1 376.1,72.1" fill="#0969da"/><text x="392.0" y="76.0" font-size="12" text-anchor="start" fill="#6a737d" font-weight="normal">1st remainder = LSB</text><text x="392.0" y="306.0" font-size="12" text-anchor="start" fill="#6a737d" font-weight="normal">last remainder = MSB</text><text x="392.0" y="322.0" font-size="12" text-anchor="start" fill="#6a737d" font-weight="normal">(write this one first)</text><text x="392.0" y="192.0" font-size="16" text-anchor="start" fill="#0969da" font-weight="bold">read UP</text><text x="30.0" y="364.0" font-size="22" text-anchor="start" fill="#1b1f24" font-weight="bold">41 = 101001₂</text><text x="30.0" y="390.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">stop when you reach 0, then read the remainders bottom to top</text></svg>