<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 346" width="680" height="346" font-family="Atkinson Hyperlegible, Verdana, Arial, sans-serif" role="img"><title>Simplify  (x + y)(x&#x27; + z)(y + z)</title><rect width="100%" height="100%" fill="#ffffff"/><text x="24.0" y="30.0" font-size="17" text-anchor="start" fill="#1b1f24" font-weight="bold">Simplify  (x + y)(x&#x27; + z)(y + z)</text><text x="24" y="74" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan>(x + y)(x&#x27; + z)</tspan><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">(y + z)</tspan></text><polyline points="34.0,86.0 34.0,112.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,112.0 30.1,103.9 37.9,103.9" fill="#bc4c00"/><text x="52.0" y="105.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">Consensus (AND form)</text><text x="250.0" y="105.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">x and x&#x27; in brackets, so (y + z) is spare</text><text x="24" y="132" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">(x + y)(x&#x27; + z)</tspan></text><polyline points="34.0,144.0 34.0,170.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,170.0 30.1,161.9 37.9,161.9" fill="#bc4c00"/><text x="52.0" y="163.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">Distributive (expand)</text><text x="250.0" y="163.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">multiply out</text><text x="24" y="190" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">xx&#x27;</tspan><tspan> + xz + x&#x27;y + yz</tspan></text><polyline points="34.0,202.0 34.0,228.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,228.0 30.1,219.9 37.9,219.9" fill="#bc4c00"/><text x="52.0" y="221.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">Complement</text><text x="250.0" y="221.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">xx&#x27; = 0</text><text x="24" y="248" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan>xz + x&#x27;y + </tspan><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">yz</tspan></text><polyline points="34.0,260.0 34.0,286.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,286.0 30.1,277.9 37.9,277.9" fill="#bc4c00"/><text x="52.0" y="279.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">Consensus</text><text x="250.0" y="279.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">x and x&#x27; again, so yz is spare</text><rect x="18.0" y="294.0" width="118.0" height="38.0" rx="6" fill="#127a8322" stroke="#127a83" stroke-width="2"/><text x="32.0" y="320.0" font-size="20" text-anchor="start" fill="#127a83" font-weight="bold">xz + x&#x27;y</text></svg>