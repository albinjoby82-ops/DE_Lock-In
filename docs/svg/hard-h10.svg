<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 288" width="680" height="288" font-family="Atkinson Hyperlegible, Verdana, Arial, sans-serif" role="img"><title>Prove  (x + z)(x&#x27; + y) = xy + x&#x27;z</title><rect width="100%" height="100%" fill="#ffffff"/><text x="24.0" y="30.0" font-size="17" text-anchor="start" fill="#1b1f24" font-weight="bold">Prove  (x + z)(x&#x27; + y) = xy + x&#x27;z</text><text x="24" y="74" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">(x + z)(x&#x27; + y)</tspan></text><polyline points="34.0,86.0 34.0,112.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,112.0 30.1,103.9 37.9,103.9" fill="#bc4c00"/><text x="52.0" y="105.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">Distributive (expand)</text><text x="250.0" y="105.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">multiply out the left side</text><text x="24" y="132" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">xx&#x27;</tspan><tspan> + xy + x&#x27;z + yz</tspan></text><polyline points="34.0,144.0 34.0,170.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,170.0 30.1,161.9 37.9,161.9" fill="#bc4c00"/><text x="52.0" y="163.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">Complement</text><text x="250.0" y="163.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">xx&#x27; = 0</text><text x="24" y="190" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan>xy + x&#x27;z + </tspan><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">yz</tspan></text><polyline points="34.0,202.0 34.0,228.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,228.0 30.1,219.9 37.9,219.9" fill="#bc4c00"/><text x="52.0" y="221.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">Consensus</text><text x="250.0" y="221.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">x and x&#x27;, so yz is spare</text><rect x="18.0" y="236.0" width="118.0" height="38.0" rx="6" fill="#127a8322" stroke="#127a83" stroke-width="2"/><text x="32.0" y="262.0" font-size="20" text-anchor="start" fill="#127a83" font-weight="bold">xy + x&#x27;z</text><text x="150.0" y="260.0" font-size="15" text-anchor="start" fill="#127a83" font-weight="bold">= right side ✓</text></svg>