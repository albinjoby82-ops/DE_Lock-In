d">Q</text><polyline points="564.0,94.0 586.0,94.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="557.0" y="99.0" font-size="14" text-anchor="end" fill="#1b1f24" font-weight="bold">Q&#x27;</text><text x="522.0" y="146.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="bold">T flip-flop</text><text x="522.0" y="170.0" font-size="15" text-anchor="middle" fill="#0969da" font-weight="bold">Q⁺ = T ⊕ Q</text></svg>