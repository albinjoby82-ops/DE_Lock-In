<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" font-family="Atkinson Hyperlegible, Verdana, Arial, sans-serif" role="img"><title>One stage of a universal shift register</title><rect width="100%" height="100%" fill="#ffffff"/><path d="M190,20 L292,47.0 L292,143.0 L190,170 Z" fill="#f6f8fa" stroke="#1b1f24" stroke-width="2"/><text x="241.0" y="100.0" font-size="12" text-anchor="middle" fill="#6a737d" font-weight="bold">4-to-1</text><polyline points="160.0,50.0 190.0,50.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="195.0" y="54.0" font-size="11" text-anchor="start" fill="#6a737d" font-weight="normal">0</text><text x="154.0" y="55.0" font-size="15" text-anchor="end" fill="#1b1f24" font-weight="bold">Aᵢ (hold)</text><polyline points="160.0,80.0 190.0,80.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="195.0" y="84.0" font-size="11" text-anchor="start" fill="#6a737d" font-weight="normal">1</text><text x="154.0" y="85.0" font-size="15" text-anchor="end" fill="#1b1f24" font-weight="bold">Aᵢ₊₁ (shift right)</text><polyline points="160.0,110.0 190.0,110.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="195.0" y="114.0" font-size="11" text-anchor="start" fill="#6a737d" font-weight="normal">2</text><text x="154.0" y="115.0" font-size="15" text-anchor="end" fill="#1b1f24" font-weight="bold">Aᵢ₋₁ (shift left)</text><polyline points="160.0,140.0 190.0,140.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="195.0" y="144.0" font-size="11" text-anchor="start" fill="#6a737d" font-weight="normal">3</text><text x="154.0" y="145.0" font-size="15" text-anchor="end" fill="#1b1f24" font-weight="bold">Iᵢ (parallel load)</text><polyline points="224.0,161.0 224.0,196.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="224.0" y="212.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="bold">s₁</text><polyline points="258.0,152.0 258.0,196.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="258.0" y="212.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="bold">s₀</text><polyline points="292.0,95.0 322.0,95.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="400.0" y="60.0" width="84.0" height="96.0" rx="5" fill="#f6f8fa" stroke="#1b1f24" stroke-width="2"/><polyline points="378.0,82.0 400.0,82.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="407.0" y="87.0" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="bold">D</text><polyline points="400.0,124.0 412.0,132.0 400.0,140.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="378.0,132.0 400.0,132.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="484.0,82.0 506.0,82.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="477.0" y="87.0" font-size="14" text-anchor="end" fill="#1b1f24" font-weight="bold">Q</text><polyline points="322.0,95.0 342.0,95.0 342.0,82.0 378.0,82.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="514.0" y="87.0" font-size="15" text-anchor="start" fill="#1b1f24" font-weight="bold">Aᵢ</text><polyline points="362.0,132.0 378.0,132.0" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="354.0" y="137.0" font-size="12" text-anchor="end" fill="#1b1f24" font-weight="normal">CLK</text><text x="280.0" y="242.0" font-size="12" text-anchor="middle" fill="#6a737d" font-weight="normal">a 4-to-1 mux in front of every flip-flop chooses what it loads next</text></svg>