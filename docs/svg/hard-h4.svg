<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 288" width="680" height="288" font-family="Atkinson Hyperlegible, Verdana, Arial, sans-serif" role="img"><title>Simplify  (a + b)&#x27;(a&#x27; + b&#x27;)&#x27;</title><rect width="100%" height="100%" fill="#ffffff"/><text x="24.0" y="30.0" font-size="17" text-anchor="start" fill="#1b1f24" font-weight="bold">Simplify  (a + b)&#x27;(a&#x27; + b&#x27;)&#x27;</text><text x="24" y="74" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">(a + b)&#x27;</tspan><tspan>(a&#x27; + b&#x27;)&#x27;</tspan></text><polyline points="34.0,86.0 34.0,112.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,112.0 30.1,103.9 37.9,103.9" fill="#bc4c00"/><text x="52.0" y="105.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">De Morgan (OR)</text><text x="250.0" y="105.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">(a + b)&#x27; = a&#x27;b&#x27;</text><text x="24" y="132" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan>a&#x27;b&#x27;</tspan><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">(a&#x27; + b&#x27;)&#x27;</tspan></text><polyline points="34.0,144.0 34.0,170.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,170.0 30.1,161.9 37.9,161.9" fill="#bc4c00"/><text x="52.0" y="163.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">De Morgan (OR)</text><text x="250.0" y="163.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">flip letters: a&#x27;&#x27; = a, b&#x27;&#x27; = b</text><text x="24" y="190" font-size="18" text-anchor="start" fill="#1b1f24" xml:space="preserve"><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">a&#x27;</tspan><tspan>b&#x27;</tspan><tspan fill="#bc4c00" font-weight="bold" text-decoration="underline">a</tspan><tspan>b</tspan></text><polyline points="34.0,202.0 34.0,228.0" fill="none" stroke="#bc4c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="34.0,228.0 30.1,219.9 37.9,219.9" fill="#bc4c00"/><text x="52.0" y="221.0" font-size="14" text-anchor="start" fill="#bc4c00" font-weight="bold">Complement + null</text><text x="250.0" y="221.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">a&#x27;a = 0, and 0 · anything = 0</text><rect x="18.0" y="236.0" width="41.0" height="38.0" rx="6" fill="#127a8322" stroke="#127a83" stroke-width="2"/><text x="32.0" y="262.0" font-size="20" text-anchor="start" fill="#127a83" font-weight="bold">0</text></svg>