<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 316" width="520" height="316" font-family="Atkinson Hyperlegible, Verdana, Arial, sans-serif" role="img"><title>0.6875 to binary by multiplying by 2</title><rect width="100%" height="100%" fill="#ffffff"/><text x="30.0" y="30.0" font-size="16" text-anchor="start" fill="#1b1f24" font-weight="bold">Fraction part: keep multiplying by 2</text><text x="30.0" y="84.0" font-size="18" text-anchor="start" fill="#1b1f24" font-weight="normal">0.6875 × 2 = 1.375</text><rect x="300.0" y="60.0" width="50.0" height="34.0" rx="6" fill="#1a7f3718" stroke="#1a7f37" stroke-width="2"/><text x="325.0" y="85.0" font-size="20" text-anchor="middle" fill="#1a7f37" font-weight="bold">1</text><text x="30.0" y="128.0" font-size="18" text-anchor="start" fill="#1b1f24" font-weight="normal">0.375 × 2 = 0.75</text><rect x="300.0" y="104.0" width="50.0" height="34.0" rx="6" fill="#1a7f3718" stroke="#1a7f37" stroke-width="2"/><text x="325.0" y="129.0" font-size="20" text-anchor="middle" fill="#1a7f37" font-weight="bold">0</text><text x="30.0" y="172.0" font-size="18" text-anchor="start" fill="#1b1f24" font-weight="normal">0.75 × 2 = 1.5</text><rect x="300.0" y="148.0" width="50.0" height="34.0" rx="6" fill="#1a7f3718" stroke="#1a7f37" stroke-width="2"/><text x="325.0" y="173.0" font-size="20" text-anchor="middle" fill="#1a7f37" font-weight="bold">1</text><text x="30.0" y="216.0" font-size="18" text-anchor="start" fill="#1b1f24" font-weight="normal">0.5 × 2 = 1.0</text><rect x="300.0" y="192.0" width="50.0" height="34.0" rx="6" fill="#1a7f3718" stroke="#1a7f37" stroke-width="2"/><text x="325.0" y="217.0" font-size="20" text-anchor="middle" fill="#1a7f37" font-weight="bold">1</text><polyline points="380.0,64.0 380.0,222.0" fill="none" stroke="#1a7f37" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="380.0,222.0 376.1,213.9 383.9,213.9" fill="#1a7f37"/><text x="392.0" y="76.0" font-size="12" text-anchor="start" fill="#6a737d" font-weight="normal">1st bit after the point</text><text x="392.0" y="148.0" font-size="16" text-anchor="start" fill="#1a7f37" font-weight="bold">read DOWN</text><text x="30.0" y="276.0" font-size="22" text-anchor="start" fill="#1b1f24" font-weight="bold">0.6875 = 0.1011₂</text><text x="30.0" y="302.0" font-size="13" text-anchor="start" fill="#6a737d" font-weight="normal">the box is the whole number you got; carry on with only the fraction; stop at 0</text></svg>